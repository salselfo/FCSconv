<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Scomposizione in Bit</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1b1f27;
    --line:#2a2f3a;
    --text:#e8e6df;
    --muted:#8b93a3;
    --accent:#5fb4a2;
    --accent-dim:#3a6e63;
    --mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, #1a2029 0%, var(--bg) 55%);
    font-family:var(--mono);
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .header{
    padding:22px 26px 18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1{
    font-size:19px;
    margin:0;
    font-weight:600;
    letter-spacing:.01em;
  }
  .sub{
    color:var(--muted);
    font-size:12.5px;
    margin-top:8px;
    line-height:1.5;
  }
  .body{
    padding:22px 26px 26px;
  }
  #f{
    display:flex;
    gap:8px;
  }
  input[type=number]{
    flex:1;
    background:#0f1217;
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    padding:11px 12px;
    border-radius:3px;
    outline:none;
  }
  input[type=number]:focus{
    border-color:var(--accent);
  }
  button{
    background:var(--accent);
    color:#0e1512;
    border:none;
    font-family:var(--mono);
    font-weight:600;
    font-size:13px;
    letter-spacing:.03em;
    padding:0 20px;
    border-radius:3px;
    cursor:pointer;
  }
  button:hover{background:#70c4b1;}
  button:active{transform:translateY(1px);}

  .result{
    margin-top:22px;
    display:none;
  }
  .result.show{display:block;}

  .target-line{
    font-size:13px;
    color:var(--muted);
    margin-bottom:14px;
  }
  .target-line b{color:var(--text);}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  th{
    text-align:left;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    padding:0 0 8px;
    border-bottom:1px solid var(--line);
  }
  td{
    padding:7px 0;
    border-bottom:1px solid var(--line);
  }
  tr:last-child td{border-bottom:none;}
  td.bit{color:var(--accent);font-weight:600;width:60px;}
  td.val{text-align:right;}
  td.mark{width:24px;text-align:center;color:var(--accent);}

  .sum-row{
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .sum-row b{color:var(--accent);}

  .remainder{
    margin-top:8px;
    font-size:12px;
    color:#d68a5c;
  }

  .empty{
    color:var(--muted);
    font-size:12.5px;
    margin-top:22px;
    display:none;
  }
  .empty.show{display:block;}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <p class="eyebrow">Bit / Val.Dec.</p>
    <h1>Scomposizione in bit</h1>
    <p class="sub">Inserisci un numero decimale: ottieni i bit (potenze di 2) la cui somma lo compone, come nella tua tabella di conversione.</p>
  </div>

  <div class="body">
    <div id="f">
      <input type="number" id="num" min="0" step="1" placeholder="Es. 24576" inputmode="numeric">
      <button type="button" id="calcBtn">Calcola</button>
    </div>

    <div class="empty" id="empty">Inserisci un numero maggiore di zero.</div>

    <div class="result" id="result">
      <div class="target-line">Numero inserito: <b id="targetVal">0</b></div>
      <table>
        <thead>
          <tr><th>Bit</th><th style="text-align:right">Val. Dec.</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="sum-row"><span>Somma bit selezionati</span><b id="sumVal">0</b></div>
      <div class="remainder" id="remainder"></div>
    </div>
  </div>
</div>

<script>
const MAX_BIT = 30; // copre valori ben oltre il range della tabella (bit 0-15)

const rowsEl = document.getElementById('rows');
const resultEl = document.getElementById('result');
const emptyEl = document.getElementById('empty');
const targetValEl = document.getElementById('targetVal');
const sumValEl = document.getElementById('sumVal');
const remainderEl = document.getElementById('remainder');
const numInput = document.getElementById('num');
const calcBtn = document.getElementById('calcBtn');

function calcola() {
  const n = parseInt(numInput.value, 10);

  if (!n || n <= 0) {
    resultEl.classList.remove('show');
    emptyEl.classList.add('show');
    return;
  }
  emptyEl.classList.remove('show');

  let remaining = n;
  let sum = 0;
  const usedBits = [];

  // Scompone dal bit più alto al più basso (greedy, coerente col metodo binario)
  for (let bit = MAX_BIT; bit >= 0; bit--) {
    const val = Math.pow(2, bit);
    if (val <= remaining) {
      usedBits.push({ bit, val });
      sum += val;
      remaining -= val;
    }
  }
  usedBits.sort((a, b) => a.bit - b.bit);

  rowsEl.innerHTML = usedBits.map(({bit, val}) => `
    <tr>
      <td class="bit">${bit}</td>
      <td class="val">${val.toLocaleString('it-IT')}</td>
      <td class="mark">✓</td>
    </tr>
  `).join('');

  targetValEl.textContent = n.toLocaleString('it-IT');
  sumValEl.textContent = sum.toLocaleString('it-IT');

  if (remaining > 0) {
    remainderEl.textContent = `Attenzione: ${remaining.toLocaleString('it-IT')} non rappresentabile con le potenze di 2 disponibili.`;
  } else {
    remainderEl.textContent = '';
  }

  resultEl.classList.add('show');
}

calcBtn.addEventListener('click', calcola);
numInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') calcola();
});
</script>

</body>
</html>
